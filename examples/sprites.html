<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sprites &amp; animation — Gleam</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>
			<a href="./">← examples</a>
			<h1>Sprites &amp; animation</h1>
			<span style="color: var(--muted)">
				auto-plays &middot; ninja frog runs around and collects apples
			</span>
		</header>

		<canvas
			id="game"
			width="192"
			height="128"
			style="
				width: 576px;
				image-rendering: crisp-edges;
				image-rendering: pixelated;
			"
		></canvas>

		<script type="importmap">
			{
				"imports": {
					"@cosmoledo/gleam": "https://cdn.jsdelivr.net/npm/@cosmoledo/gleam/dist/esm/index.js"
				}
			}
		</script>
		<script type="module">
			// Loading + animation demo. A ninja frog auto-runs across a tiled
			// ground, turning at the edges and hopping now and then — no input.
			//
			//   loadBunch         - await several loaders at once
			//   loadCanvas        - image URL -> HTMLCanvasElement (sliceable)
			//   loadImage         - image URL -> HTMLImageElement (draw as-is)
			//   loadImageFromJson - sprite atlas -> { name: canvas } by region
			//   splitSpriteSheet  - cut a strip into an array of frame canvases
			//   Animator          - play named animations from frame arrays
			import {
				Game,
				CANVAS_TYPES,
				Vec2,
				Animator,
				splitSpriteSheet,
				clamp,
				randomBetweenFloat,
				getElement,
				loadBunch,
				loadCanvas,
				loadImage,
				loadImageFromJson,
			} from "@cosmoledo/gleam";

			// Pixel art at 16/32 px. The ground is anchored to the bottom of the
			// canvas, so the layout follows the canvas size.
			const TILE = 16; // terrain tile size
			const FRAME = 32; // character frame size
			const GROUND_ROWS = 3; // grass row + dirt, anchored to the bottom
			// The frog's body sits inside its 32px frame; shrink the hitbox so
			// the pickup triggers on visible contact, not the transparent margin.
			const FROG_PAD = 8;

			// A self-animating character. Gleam's Animator works on any object
			// that exposes `pos` (its draw anchor); it also sets an optional
			// `flipX` offset on the object itself for left-facing frames. So we
			// hand the frog straight to the Animator — no separate sprite object.
			class Frog {
				static #SPEED = 40; // world px / second
				static #JUMP = 80; // initial hop speed
				static #GRAVITY = 220;

				pos = new Vec2();

				#anim;
				#boundsX = new Vec2(); // x = min, y = max horizontal travel
				#hopIn = 2; // seconds until the next hop
				#idleFor = 0; // seconds left of the turn-around pause
				#lookLeft = false; // true when moving / facing left
				#state = "run"; // run | idle | air
				#velY = 0;

				constructor(sheets, minX, maxX) {
					this.#boundsX.set(minX, maxX);
					this.pos.x = minX; // scene will place us on the floor (pos.y)

					// Each sheet is one horizontal strip; splitSpriteSheet cuts it
					// into per-frame canvases. We slice per-Frog here to keep the
					// example self-contained, but it could run once at load time
					// (right after loadCanvas) and the frame arrays be shared —
					// worth it if you spawn many frogs.
					// A shared namespace ("frog") lets Animator cache the rendered
					// frames — cheap even if we spawned many frogs.
					this.#anim = new Animator(this, "frog");
					this.#anim.add(
						"run",
						splitSpriteSheet(sheets.run, 12, 1),
						0.05,
						true,
					);
					this.#anim.add(
						"idle",
						splitSpriteSheet(sheets.idle, 11, 1),
						0.08,
					);
					this.#anim.add(
						"jump",
						splitSpriteSheet(sheets.jump, 1, 1),
						0.1,
					);
					this.#anim.add(
						"fall",
						splitSpriteSheet(sheets.fall, 1, 1),
						0.1,
					);
				}

				// `groundY` is the floor line — owned by the scene, passed in each frame
				update(dt, groundY) {
					switch (this.#state) {
						case "run":
							this.#run(dt);
							break;
						case "idle":
							this.#waitThenTurn(dt);
							break;
						case "air":
							this.#fly(dt, groundY);
							break;
					}

					this.#anim.lookLeft = this.#lookLeft;
					this.#anim.update(dt);
				}

				draw(ctx) {
					this.#anim.draw(ctx);
				}

				// running along the ground -> pause at an edge, else maybe hop
				#run(dt) {
					this.pos.add(
						(this.#lookLeft ? -1 : 1) * Frog.#SPEED * dt,
						0,
					);
					this.#anim.playIfNot("run");

					const atEdge =
						(this.#lookLeft && this.pos.x <= this.#boundsX.x) ||
						(!this.#lookLeft && this.pos.x >= this.#boundsX.y);

					if (atEdge) {
						this.pos.x = clamp(
							this.pos.x,
							this.#boundsX.x,
							this.#boundsX.y,
						);
						this.#state = "idle";
						this.#idleFor = 0.6;
						this.#anim.play("idle");
						return;
					}

					this.#hopIn -= dt;
					if (this.#hopIn <= 0) {
						this.#velY = -Frog.#JUMP;
						this.#state = "air";
						this.#anim.play("jump");
					}
				}

				// idling at an edge -> flip direction and run back
				#waitThenTurn(dt) {
					this.#idleFor -= dt;
					if (this.#idleFor <= 0) {
						this.#lookLeft = !this.#lookLeft;
						this.#startRunning();
					}
				}

				// airborne -> gravity, swap to fall at the apex, land on the ground
				#fly(dt, groundY) {
					this.#velY += Frog.#GRAVITY * dt;
					this.pos.add(
						(this.#lookLeft ? -1 : 1) * Frog.#SPEED * dt,
						this.#velY * dt,
					);
					this.pos.x = clamp(
						this.pos.x,
						this.#boundsX.x,
						this.#boundsX.y,
					);

					if (this.#velY >= 0 && this.#anim.isPlaying("jump")) {
						this.#anim.play("fall");
					}

					if (this.pos.y >= groundY) {
						this.pos.y = groundY;
						this.#velY = 0;
						this.#startRunning();
					}
				}

				#startRunning() {
					this.#state = "run";
					this.#hopIn = randomBetweenFloat(1.5, 3.5);
					this.#anim.play("run");
				}
			}

			class SpritesDemo extends Game {
				// the loadBunch result: character frame strips (idle/run/jump/fall
				// canvases), the `apple` image, and the `tiles` atlas
				// ({ grass, dirt, wood, ... } canvases keyed by name)
				#assets;
				#applePos = new Vec2();
				#frog;
				#grassTop; // world y of the grass surface
				#groundY; // world y so a 32px sprite's feet rest on the grass

				// Assets arrive already loaded (see bootstrap below), so the game
				// is never in a half-loaded state.
				constructor(assets) {
					super({
						fps: 1 / 60,
						// paint a sky color each frame instead of clearing to
						// transparent (which shows the page behind the canvas)
						useClearRect: false,
						backgroundColor: "#3a4466",
						enableResize: false,
					});
					this.#assets = assets;
					this.canman.setupCanvas(CANVAS_TYPES.MAIN, "#game");
					this.preInit();
				}

				init() {
					const worldW = this.canman.width;
					const worldH = this.canman.height;
					this.#grassTop = worldH - GROUND_ROWS * TILE;
					this.#groundY = this.#grassTop - FRAME;
					this.#frog = new Frog(this.#assets, 0, worldW - FRAME);
					this.#frog.pos.y = this.#groundY; // scene owns the floor
					this.#relocateApple();
				}

				update(dt) {
					this.#frog.update(dt, this.#groundY);

					// grab the apple on contact -> it hops to a new spot
					if (this.#touchesApple()) {
						this.#relocateApple();
					}
				}

				draw(ctx) {
					// ground: a grass row, then dirt filling down to the bottom
					const cols = Math.ceil(this.canman.width / TILE);
					for (let col = 0; col < cols; col++) {
						const x = col * TILE;
						ctx.drawImage(
							this.#assets.tiles.grass,
							x,
							this.#grassTop,
						);

						for (
							let y = this.#grassTop + TILE;
							y < this.canman.height;
							y += TILE
						) {
							ctx.drawImage(this.#assets.tiles.dirt, x, y);
						}
					}

					// a single loaded image, drawn as-is
					ctx.drawImage(
						this.#assets.apple,
						this.#applePos.x,
						this.#applePos.y,
					);

					// the animated character (drawn last -> in front)
					this.#frog.draw(ctx);
				}

				// AABB overlap of the frog's inset frame with the apple
				#touchesApple() {
					const f = this.#frog.pos;
					const a = this.#applePos;

					return (
						f.x + FROG_PAD < a.x + this.#assets.apple.width &&
						f.x + FRAME - FROG_PAD > a.x &&
						f.y + FROG_PAD < a.y + this.#assets.apple.height &&
						f.y + FRAME - FROG_PAD > a.y
					);
				}

				// Send the apple to a fresh x (away from the frog), lifted up to
				// two-thirds of a frame above the grass so it stays reachable
				// without jumping.
				#relocateApple() {
					const worldW = this.canman.width;
					const restY = this.#grassTop - this.#assets.apple.height;
					const maxX = worldW - this.#assets.apple.width;

					// re-roll until the spot is at least ~1.5 frog-widths from the
					// frog, so the apple never lands on it (which would instantly
					// re-trigger a grab)
					let x;
					do {
						x = randomBetweenFloat(0, maxX);
					} while (Math.abs(x - this.#frog.pos.x) < 1.5 * FRAME);

					this.#applePos.set(
						x,
						restY - randomBetweenFloat(0, FRAME * (2 / 3)),
					);
				}
			}

			// Draw a placeholder while the network fetches run.
			const canvas = getElement("#game");
			const splash = canvas.getContext("2d");
			splash.fillStyle = "#3a4466";
			splash.fillRect(0, 0, canvas.width, canvas.height);
			splash.fillStyle = "#e0e0e0";
			splash.font = "20px system-ui, sans-serif";
			splash.textAlign = "center";
			splash.fillText("Loading…", canvas.width / 2, canvas.height / 2);

			// Load everything up front, THEN build the game with the results.
			// Paths are relative to this file (examples/), so "assets/…".
			loadBunch({
				idle: loadCanvas("assets/idle.png"),
				run: loadCanvas("assets/run.png"),
				jump: loadCanvas("assets/jump.png"),
				fall: loadCanvas("assets/fall.png"),
				apple: loadImage("assets/apple.png"),
				tiles: loadImageFromJson("assets/", "terrain"),
			})
				.then(assets => new SpritesDemo(assets))
				.catch(error => {
					// A bad path / offline CDN lands here; the loaders also log.
					splash.fillStyle = "#3a4466";
					splash.fillRect(0, 0, canvas.width, canvas.height);
					splash.fillStyle = "#ff6b6b";
					splash.fillText(
						"Failed to load assets — see console.",
						canvas.width / 2,
						canvas.height / 2,
					);
					console.error(error);
				});
		</script>
	</body>
</html>
