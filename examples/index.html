<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Gleam — examples</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>
			<h1>Gleam examples</h1>
			<a href="https://github.com/Cosmoledo/Gleam">github</a>
		</header>

		<div class="gallery">
			<nav class="picker">
				<button data-name="Bouncing ball" data-src="./bouncing-ball.js">
					<strong>Bouncing ball</strong>
					<span>Vec2, levelTime-driven spawning, randomHex.</span>
				</button>
				<button data-name="Brick breaker" data-src="./brick-breaker.js">
					<strong>Brick breaker</strong>
					<span>Keyboard input, Rect collision, game states.</span>
				</button>
				<button data-name="Screenshake" data-src="./screenshake.js">
					<strong>Screenshake</strong>
					<span>Screenshake effect.</span>
				</button>
				<button data-name="Sprites & animation" data-src="./sprites.js">
					<strong>Sprites & animation</strong>
					<span>
						loadBunch, splitSpriteSheet, Animator, tile atlas.
					</span>
				</button>
				<button data-name="Audio" data-src="./audio.js">
					<strong>Audio</strong>
					<span>Sound SFX + Music cross-fade, autoplay gotcha.</span>
				</button>
				<button data-name="Pointer input" data-src="./pointer.js">
					<strong>Pointer input</strong>
					<span>Pointer poll vs. event; drag or Space to spawn.</span>
				</button>
				<button data-name="Particles" data-src="./particles.js">
					<strong>Particles</strong>
					<span>Particle spray, alive-filtering, drawCircle.</span>
				</button>
			</nav>

			<div class="stage">
				<header>
					<h2></h2>
					<span style="color: var(--muted)"></span>
				</header>

				<canvas id="game" width="640" height="360"></canvas>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@cosmoledo/gleam": "https://cdn.jsdelivr.net/npm/@cosmoledo/gleam/dist/esm/index.js"
				}
			}
		</script>
		<script defer>
			const canvasElement = document.querySelector("#game");

			const frameElement = document.querySelector(".stage");
			const titleElement = frameElement.querySelector("header h2");
			const descElement = frameElement.querySelector("header span");
			const buttonElements = Array.from(
				document.querySelectorAll(".picker button"),
			);

			async function showButtonGame(button) {
				titleElement.innerHTML = button.dataset.name;

				const { init } = await import(button.dataset.src);
				init(desc => (descElement.innerHTML = desc), canvasElement);

				buttonElements.forEach(b =>
					b.setAttribute(
						"aria-current",
						b === button ? "true" : "false",
					),
				);
			}

			function updateQueryTo(button) {
				const urlParams = new URLSearchParams(window.location.search);
				urlParams.set("show", button.dataset.name);
				window.location.search = urlParams.toString();
			}

			buttonElements.forEach(button =>
				button.addEventListener("click", () => updateQueryTo(button)),
			);

			const urlParams = new URLSearchParams(window.location.search);
			const showParam = urlParams.get("show");

			const buttonIndex = buttonElements.findIndex(
				ele => ele.dataset.name === showParam,
			);

			if (buttonIndex === -1) {
				updateQueryTo(buttonElements[0]);
			} else {
				showButtonGame(buttonElements[buttonIndex]);
			}
		</script>
	</body>
</html>
