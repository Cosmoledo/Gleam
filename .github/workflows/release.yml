name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    verify:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false # never use caching in release builds

            - run: npm ci

            - run: npm run build

            - run: npm publish --ignore-scripts

            # Notes come from CHANGELOG.md's newest release via keep-a-changelog.
            # Guarded so a tag that doesn't match the changelog's latest version
            # falls back to auto-generated notes instead of publishing stale ones.
            - name: Create GitHub release
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  CHANGELOG_BIN="node_modules/keep-a-changelog/bin.js"
                  LATEST="$(node "$CHANGELOG_BIN" --latest-release)"
                  if [ "$LATEST" = "$VERSION" ]; then
                      node "$CHANGELOG_BIN" --latest-release-full \
                          | sed '1{/^## /d;}' > notes.md
                      gh release create "$GITHUB_REF_NAME" --notes-file notes.md
                  else
                      echo "CHANGELOG latest ($LATEST) != tag ($VERSION); using auto-generated notes."
                      gh release create "$GITHUB_REF_NAME" --generate-notes
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
